name: Conformance

# The official test suite, both official SDKs in both directions, and every message checked against
# the published schema. All three pin a version, so a green run means the same thing tomorrow.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  conformance:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install python and node
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the agent under test
        run: |
          moon build --target native src/examples/02-notes-agent
          echo "AGENT=$PWD/_build/native/debug/build/examples/02-notes-agent/02-notes-agent.exe" >> $GITHUB_ENV

      - name: the official test suite
        run: |
          git clone --filter=blob:none https://github.com/agentclientprotocol/acp-tck.git /tmp/acp-tck
          git -C /tmp/acp-tck checkout b7f40fb3c003c45926547be5a1f7e2b374035815
          python -m pip install uv
          uv run --project /tmp/acp-tck acp-tck \
            --agent-cwd "$GITHUB_WORKSPACE" \
            --timeout 30 --test-timeout 120 \
            --report-json "$GITHUB_WORKSPACE/acp-tck-report.json" \
            -- "$AGENT"

      - name: every message against the published schema
        run: |
          python -m pip install jsonschema==4.23.0
          python scripts/conformance/check_messages.py -- "$AGENT"

      - name: the official TypeScript client
        run: |
          npm install --prefix scripts/interop
          cd scripts/interop && node ts-client.mjs -- "$AGENT"

      - name: the official Python client
        run: |
          python -m pip install -r scripts/interop/requirements.txt
          python scripts/interop/py-client.py -- "$AGENT"

      - name: our client against the official TypeScript agent
        run: |
          moon build --target native src/examples/03-client
          timeout 120 ./_build/native/debug/build/examples/03-client/03-client.exe \
            node scripts/interop/ts-agent.mjs | tee client-report.txt
          grep -q "stop: end_turn" client-report.txt
          grep -q "answer: ts echo: hello from a MoonBit client" client-report.txt

      - name: our client against the official Python agent
        run: |
          timeout 120 ./_build/native/debug/build/examples/03-client/03-client.exe \
            python scripts/interop/py-agent.py | tee python-report.txt
          grep -q "stop: end_turn" python-report.txt
          grep -q "answer: python echo: hello from a MoonBit client" python-report.txt

  # The remote transport, driven by the official Rust client: their `HttpClient` against this
  # library's ASGI application, served by mooncat. The integration module is a workspace member of
  # this repository at build time, which is how it compiles against the working tree rather than
  # the published module; `moon.work` is written here and is not part of the repository.
  rust-http:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: serve the agent over HTTP
        run: |
          printf 'members = [".", "integration/http-acp"]\n' > moon.work
          moon build --target native
          AGENT=$(find _build/native/debug/build -name 'moonacp-integration-http*' -type f -perm -u+x | head -1)
          echo "the server is $AGENT"
          echo "HTTP_AGENT=$PWD/$AGENT" >> $GITHUB_ENV

      - name: the official Rust client, over HTTP
        run: |
          cargo build --release --manifest-path scripts/interop/rust-http-client/Cargo.toml
          ./scripts/interop/rust-http-client/target/release/acp-http-interop "$HTTP_AGENT"

      # The other direction, against the address the server printed: the client here is this
      # library's, and the agent is the one the official SDK ships.
      - name: this library's client, over HTTP, against this library's server
        run: |
          CLIENT=$(find _build/native/debug/build -name '05-remote*' -type f -perm -u+x | head -1)
          echo "the client is $CLIENT"
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          "$HTTP_AGENT" "$port" > "$RUNNER_TEMP/moonacp-server.log" 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            grep -q "serving on" "$RUNNER_TEMP/moonacp-server.log" && break
            sleep 1
          done
          timeout 60 "$CLIENT" "http://127.0.0.1:$port/acp" | tee moonacp-http-report.txt
          kill "$server" 2>/dev/null || true
          grep -q "stop: end_turn" moonacp-http-report.txt
          grep -q "answer: you said: hello from a MoonBit client" moonacp-http-report.txt

      # And the same client against the official SDK's agent, which is the direction the first
      # run below could not cover: their client reaching our server says nothing about ours.
      - name: this library's client, over HTTP, against the official Rust agent
        run: |
          CLIENT=$(find _build/native/debug/build -name '05-remote*' -type f -perm -u+x | head -1)
          cargo build --release --manifest-path scripts/interop/rust-http-agent/Cargo.toml
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          ./scripts/interop/rust-http-agent/target/release/acp-http-agent "$port" > "$RUNNER_TEMP/rust-agent.log" 2>&1 &
          agent=$!
          for attempt in $(seq 1 60); do
            grep -q "serving on" "$RUNNER_TEMP/rust-agent.log" && break
            sleep 1
          done
          timeout 60 "$CLIENT" "http://127.0.0.1:$port/acp" | tee rust-agent-http-report.txt
          kill "$agent" 2>/dev/null || true
          grep -q "stop: end_turn" rust-agent-http-report.txt
          grep -q "answer: rust echo: hello from a MoonBit client" rust-agent-http-report.txt
