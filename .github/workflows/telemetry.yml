name: Telemetry

# What this library writes to a trace, checked against the registry the spans are named from.
#
# `weaver registry live-check` listens for OTLP and compares every signal it receives — spans and
# metrics both — with the OpenTelemetry GenAI semantic conventions: a name the registry does not
# define, an attribute the signal does not declare, or a value of the wrong type is a finding. The
# example under test is a whole conversation — a turn, the file the agent reads through the editor,
# and a turn that fails — exported over OTLP/gRPC, so one run covers both statuses, both span types
# and both histograms.
#
# The registry is pinned to the commit `moontel/semconv` was generated from, and weaver to a
# release, so a green run means the same thing tomorrow.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  live-check:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    env:
      WEAVER_VERSION: "0.28.0"
      # The release's own checksum: the download is retried, and a body that is not the
      # release is not unpacked.
      WEAVER_SHA256: "9878e2d56ad82ae441b0b527377a4f6001ae19f4af362fb0a4d951884f59ab61"
      SEMCONV_GENAI_COMMIT: "aa3b7f4394245fec260013898049780975a407a4"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the traced example
        run: |
          moon build --target native src/examples/04-otel

      # `gh release download` goes through the API rather than the download redirect, which is the
      # path that answers 504 when the release CDN is unhappy. The digest is the release's own, so a
      # body that arrived is the release and not an error page with a 200 on it.
      - name: install weaver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/weaver.tar.xz"
          for attempt in 1 2 3 4 5; do
            gh release download "v${WEAVER_VERSION}" --repo open-telemetry/weaver \
              --pattern 'weaver-x86_64-unknown-linux-gnu.tar.xz' \
              --output "$RUNNER_TEMP/weaver.tar.xz" --clobber || true
            if echo "$WEAVER_SHA256  $RUNNER_TEMP/weaver.tar.xz" | sha256sum -c --status -; then
              break
            fi
            echo "attempt $attempt did not download the release; retrying"
            sleep 10
          done
          echo "$WEAVER_SHA256  $RUNNER_TEMP/weaver.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/weaver.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/weaver-x86_64-unknown-linux-gnu" >> $GITHUB_PATH

      - name: the conventions, at the pinned commit
        run: |
          git clone https://github.com/open-telemetry/semantic-conventions-genai.git "$RUNNER_TEMP/semconv-genai"
          git -C "$RUNNER_TEMP/semconv-genai" checkout "$SEMCONV_GENAI_COMMIT"

      - name: the signals against the registry
        run: |
          weaver registry live-check \
            --registry "$RUNNER_TEMP/semconv-genai/model" \
            --otlp-grpc-port 4317 --admin-port 4320 \
            --inactivity-timeout 10 --format json --v2 --search-all-attributes \
            --output "$RUNNER_TEMP/live-check" --fail-on violation \
            > "$RUNNER_TEMP/weaver.log" 2>&1 &
          listener=$!
          for attempt in $(seq 1 120); do
            if grep -q "listener started" "$RUNNER_TEMP/weaver.log"; then
              break
            fi
            sleep 1
          done
          ./_build/native/debug/build/examples/04-otel/04-otel.exe 127.0.0.1:4317
          wait "$listener"
          cat "$RUNNER_TEMP/weaver.log"
