[package]
name = "acp-http-interop"
version = "0.1.0"
edition = "2021"
publish = false

# The official SDK, pinned: a green run means the same thing tomorrow.
[dependencies]
agent-client-protocol = "=5.0.0"
agent-client-protocol-http = { version = "=5.0.0", features = ["client"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[profile.dev]
debug = 0
